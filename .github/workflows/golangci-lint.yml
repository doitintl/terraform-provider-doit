name: golangci-lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            lint:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - '.golangci.yml'
              - '.custom-gcl.yml'
              - 'GNUmakefile'
              - '.github/workflows/golangci-lint.yml'

  golangci:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event.pull_request.draft == false &&
      needs.changes.outputs.lint == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Install golangci-lint via the official action (install only, no run).
      # The binary is needed to build our custom-gcl with module plugins.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true

      # Lint the linter source code itself with stock golangci-lint.
      - name: Lint custom linters
        run: make lint-tools

      # Run unit tests for custom analyzers.
      - name: Test custom linters
        run: |
          cd tools/linters
          go test -v ./...

      # Run unit tests for schema extraction tools.
      - name: Test schema tools
        run: go test -v ./tools/extract-inline-schemas/...

      # Build custom binary and run linting (same as local `make lint`)
      - name: golangci-lint (custom)
        run: make lint
