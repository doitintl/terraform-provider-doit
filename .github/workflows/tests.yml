name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Run daily at 5am UTC
    - cron: "0 5 * * *"

# Acceptance tests mutate shared remote resources, so only one run of this
# workflow may execute at a time. A single fixed group key serializes runs
# across all branches/PRs. cancel-in-progress: false queues new runs behind
# the in-progress one instead of cancelling it.
concurrency:
  group: acceptance-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate Examples
        run: make validate-examples

  validate-docs:
    name: Validate Docs
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate Docs
        run: make validate-docs

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      checks: write # allow the JUnit reporter to publish a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: go mod download

      # gotestsum reruns individual failed tests to absorb upstream API flakiness.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Tests
        env:
          TF_ACC: "1"
          DOIT_API_TOKEN: ${{ secrets.DOIT_API_TOKEN }}
          DOIT_HOST: ${{ vars.DOIT_HOST }}
          TEST_USER: ${{ vars.TEST_USER }}
          TEST_ATTRIBUTION: ${{ vars.TEST_ATTRIBUTION }}
          TEST_ATTRIBUTION_GROUP: ${{ vars.TEST_ATTRIBUTION_GROUP }}
          TEST_SLACK_CHAN: ${{ vars.TEST_SLACK_CHAN }}
          TEST_SLACK_WORKSPACE: ${{ vars.TEST_SLACK_WORKSPACE }}
          TEST_PROJECT: ${{ vars.TEST_PROJECT }}
          TEST_CUSTOMER_ID: ${{ vars.TEST_CUSTOMER_ID }}
          TEST_BILLING_EXPLAINER_INVOICE_MONTH: ${{ vars.TEST_BILLING_EXPLAINER_INVOICE_MONTH }}
          TEST_INVOICE_ID: ${{ vars.TEST_INVOICE_ID }}
          TEST_ANOMALY_ID: ${{ vars.TEST_ANOMALY_ID }}
          TEST_CLOUD_INCIDENT_ID: ${{ vars.TEST_CLOUD_INCIDENT_ID }}
          TEST_COMMITMENT_ID: ${{ vars.TEST_COMMITMENT_ID }}
          TEST_ASSET_ID: ${{ vars.TEST_ASSET_ID }}
          TEST_ASSET_ID_AWS: ${{ vars.TEST_ASSET_ID_AWS }}
          TEST_CLOUD_DIAGRAM_RESOURCE: ${{ vars.TEST_CLOUD_DIAGRAM_RESOURCE }}
          TEST_USER_2: ${{ vars.TEST_USER_2 }}
          TEST_INVITE_EMAIL: ${{ vars.TEST_INVITE_EMAIL }}
          TEST_AWS_ACCOUNT_ID: ${{ vars.TEST_AWS_ACCOUNT_ID }}
          TEST_AWS_ROLE_ARN: ${{ vars.TEST_AWS_ROLE_ARN }}
          TEST_AWS_S3_BUCKET: ${{ vars.TEST_AWS_S3_BUCKET }}
          TEST_AWS_S3_BUCKET_REGION: ${{ vars.TEST_AWS_S3_BUCKET_REGION }}
        run: |
          gotestsum \
            --format standard-verbose \
            --rerun-fails=2 \
            --rerun-fails-max-failures=5 \
            --packages='./...' \
            --junitfile test-results.xml \
            -- -timeout 120m

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always() # publish results even when tests fail
        with:
          report_paths: test-results.xml
          check_name: Acceptance Tests
          check_retries: true # gotestsum emits one <testcase> per attempt; treat a recovered flaky as passed
          flaky_summary: true # table of tests that failed then passed on rerun
          detailed_summary: true # full results table in the job summary
          require_tests: true # fail the report if no tests matched (e.g. compile error, empty XML)
          fail_on_parse_error: true # fail if test-results.xml is unparseable
          truncate_stack_traces: false # keep full TF error output in annotations
