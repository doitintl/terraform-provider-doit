# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: modelsv2
output: models_gen.go
generate:
  models: true
  client: true
compatibility:
  always-prefix-enum-values: true
  # Pinned explicitly: v3 becomes oapi-codegen's default in v2.10.0. The output is
  # identical to v2 for our specs (extract-inline-schemas flattens multi-member allOf first).
  schema-merging-behavior: v3
output-options:
  response-type-suffix: Resp
  nullable-type: true
