            $ref: "#/components/schemas/OnboardingFinding"
    StepError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      description: Sanitized error reported by a follow-up or verification step.
      properties:
        code:
          type: string
          example: required_permission_missing
        operation:
          type: string
          example: enable_feature_consumers
        message:
          type: string
          example: Required permissions were not found on the role.
    VerificationSummary:
      type: object
      additionalProperties: false
      required:
        - status
      description: Summary of the last synchronous verification check recorded on the connection.
      properties:
        status:
          type: string
          enum:
            - passed
            - partial
            - failed
            - not_checked
          example: passed
        observationTime:
          type:
            - string
            - "null"
          format: date-time
          example: "2026-11-23T12:00:00Z"
        checkedRevision:
          type:
            - string
            - "null"
          example: "1"
        catalogVersion:
          type:
            - string
            - "null"
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
  headers:
    RequestID:
      description: |
        Request-Id for log correlation. Present on every DoiT API response.
        Value has the form `req_<ULID>`. On error responses it equals the
        trailing path segment of the Problem Details `instance` URI — grep on
        this value ties client-side error reports to server-side log entries.
      schema:
        $ref: '#/components/schemas/RequestID'
    ContentLanguage:
      description: |
        RFC 7231 Content-Language header. Present on every DoiT API response;
        identifies the language of any human-readable text in the response.
        Currently `en` only.
      schema:
        type: string
        enum:
          - en
        default: en
        examples:
          - en
      examples: {}
    XRateLimitLimit:
      description: |
        Total quota for the caller's rate-limit window. Present on responses from
        rate-limited endpoints — including successful (2xx) responses, not just
        429s — so clients can budget preemptively. Absent on endpoints not subject
        to rate limiting.
      schema:
        type: integer
        minimum: 0
        examples:
          - 1000
      examples: {}
    XRateLimitRemaining:
      description: |
        Requests remaining in the caller's current rate-limit window. Present on
        responses from rate-limited endpoints, absent on endpoints not subject to
        rate limiting. Reaches 0 at the moment the next request would be rejected
        with `429 rate_limited`.
      schema:
        type: integer
        minimum: 0
        examples:
          - 847
      examples: {}
    XRateLimitReset:
      description: |
        Seconds until the rate-limit window resets (i.e. when `X-RateLimit-Remaining`
        will replenish to `X-RateLimit-Limit`). Delay-seconds form for consistency
        with `Retry-After`; DoiT APIs never emit HTTP-date form.

        Present on responses from rate-limited endpoints, absent on endpoints not
        subject to rate limiting.
      schema:
        type: integer
        minimum: 0
        examples:
          - 42
      examples: {}
    XDryRun:
      description: |
        Set to `true` on responses to dry-run requests (requests made with
        `?dryRun=true`). Lets intermediaries and observability tooling
        distinguish dry-run responses from real ones without inspecting the
        request URL.

        Absent on responses to real (non-dry-run) requests — when present, the
        value is always `true`.
      schema:
        type: boolean
        enum:
          - true
        examples:
          - true
      examples: {}
    ETag:
      description: |
        Strong ETag for optimistic concurrency. DoiT APIs emit strong
        ETags only — weak ETags (`W/"..."`) are not used because RFC 7232 §2.1
        disallows their use in `If-Match` preconditions.

        The same value appears as the `etag` body field on the resource; clients
        MAY use either form.
      schema:
        type: string
        pattern: ^"[!-~]+"$
        examples:
          - "\"7b1c8ff2a3e5\""
      examples: {}
    Location:
      description: |
        URI of the resource created by a `201 Created` response, or the operation
        resource returned by a `202 Accepted` response (long-running action;
        clients poll this URI for completion), per RFC 9110 §10.2.2. Absolute or
        root-relative.
      schema:
        type: string
        format: uri-reference
        examples:
          - /cloudflow/v1/flows/01H5X8Z2AB3CDEFGHJKMNP0QRS
      examples: {}
    WWWAuthenticate:
      description: |
        Advertises the authentication scheme required by the resource, per
        RFC 9110 §11.6.1. Present on every `401 Unauthorized` response. DoiT
        APIs use Bearer token auth; the realm is the API domain.
      schema:
        type: string
        examples:
          - Bearer realm="api.doit.com"
      examples: {}
    RetryAfter:
      description: |
        Retry-After header per RFC 7231 §7.1.3. **Delay-seconds form only** —
        DoiT APIs never emit the HTTP-date form. Present on `429 Too Many Requests`
        and `503 Service Unavailable` responses; overrides the client's local
        backoff schedule for the immediate next attempt.
      schema:
        type: integer
        minimum: 1
        examples:
          - 30
      examples: {}
