  /onboarding/v2/billing/gcp/requirements:
    post:
      operationId: resolveGcpBillingRequirements
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Billing
      summary: Resolve GCP billing onboarding requirements
      description: |
        Returns the DoiT service account the customer grants read access to,
        the two IAM roles to grant and where, and the export prerequisite.
        The first call for a customer reserves its DoiT service account, as
        the Console does when onboarding starts; every later call, dry run or
        not, returns the same account and changes nothing.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Resolved GCP billing onboarding requirements.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpBillingRequirementsResponse"
              examples:
                requirements:
                  summary: Resolved GCP billing requirements
                  value:
                    serviceAccountEmail: billing-reader@example-project.iam.gserviceaccount.com
                    grants:
                      - role: roles/billing.viewer
                        target: billing_account
                      - role: roles/bigquery.dataViewer
                        target: export_dataset
                    prerequisites:
                      - >-
                        Enable the Cloud Billing detailed usage cost export to a BigQuery dataset before connecting. Google offers no API for this step: https://cloud.google.com/billing/docs/how-to/export-data-bigquery-setup
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /onboarding/v2/billing/gcp/accounts:
    post:
      operationId: createGcpBillingAccount
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Billing
      summary: Connect a GCP billing account
      description: |
        Checks that DoiT's service account can read the billing account and
        the detailed usage cost export table, records the connection as
        `pending`, and activates it in the background. Poll the item until
        `status` is `active` or `failed`; a connection reads `failed` at the
        latest about 40 minutes after connect (up to 15 minutes before the
        activation starts and up to 25 minutes while it runs). The billing
        export's table layout is checked during the activation, so a wrong
        table ends `failed` rather than refusing the connect.

        Connect is idempotent on the billing account and export: it returns
        the existing `pending` or `active` connection, including one made in
        the Console, with `201`. A different
        export returns `409 onboarding.billing_connection_activating`
        (retryable) while the connection is `pending`, and
        `409 onboarding.billing_connection_export_mismatch` once it is
        `active`, until it is disconnected. A `failed` connection can be
        connected again with any export. The billing account and export cannot
        be changed in place: disconnect and connect again.

        With `dryRun=true` the call answers `200` with what it would return,
        after the same checks, without recording the connection or queuing its
        activation. Like requirements, it reserves the customer's DoiT service
        account when none is reserved yet.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: Billing account and its detailed usage cost export dataset.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GcpBillingAccountCreate"
            examples:
              create:
                summary: Connect a billing account
                value:
                  billingAccountId: 012345-6789AB-CDEF01
                  exportProjectId: example-billing-project
                  exportDatasetId: billing_export
      responses:
        "201":
          description: Billing account connection recorded; activation runs in the background.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpBillingAccount"
              examples:
                created:
                  summary: Pending billing account connection
                  value:
                    id: 012345-6789AB-CDEF01
                    billingAccountId: 012345-6789AB-CDEF01
                    exportProjectId: example-billing-project
                    exportDatasetId: billing_export
                    status: pending
        "200":
          description: Dry-run preview of the connection when `dryRun=true`.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpBillingAccount"
              examples:
                dryRun:
                  summary: Dry-run preview of a billing account connection
                  value:
                    id: 012345-6789AB-CDEF01
                    billingAccountId: 012345-6789AB-CDEF01
                    exportProjectId: example-billing-project
                    exportDatasetId: billing_export
                    status: pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /onboarding/v2/billing/gcp/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/GcpBillingAccountId"
    get:
      operationId: getGcpBillingAccount
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Billing
      summary: Get a GCP billing account connection
      description: |
        Returns the billing account connection and its activation `status`
        (`pending`, `active` or `failed`, with `failureReason` when failed).
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
      responses:
        "200":
          description: Billing account connection.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpBillingAccount"
              examples:
                active:
                  summary: Active billing account connection
                  value:
                    id: 012345-6789AB-CDEF01
                    billingAccountId: 012345-6789AB-CDEF01
                    exportProjectId: example-billing-project
                    exportDatasetId: billing_export
                    status: active
                failed:
                  summary: Failed billing account connection
                  value:
                    id: 012345-6789AB-CDEF01
                    billingAccountId: 012345-6789AB-CDEF01
                    exportProjectId: example-billing-project
                    exportDatasetId: billing_export
                    status: failed
                    failureReason: >-
                      DoiT's service account cannot read the billing export table; check that it has roles/bigquery.dataViewer on the export dataset and that the detailed usage cost export writes to that dataset, then connect again
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteGcpBillingAccount
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Billing
      summary: Disconnect a GCP billing account
      description: |
        Disconnects the billing account with the same effect as the Console
        offboarding. Returns `409 onboarding.billing_connection_activating`
        (retryable) while the activation is still running. After a partial
        failure the connection reads `failed` and the disconnect can be
        repeated. Customer IAM grants and the export dataset remain untouched.

        With `dryRun=true` the connection that would be disconnected comes back
        with `200`, refused the same way, without removing anything. A
        leftover DoiT asset of the billing account that a disconnect would
        remove previews as a `failed` connection without `exportProjectId` and
        `exportDatasetId`.

        `422 idempotency_key_reused` means the `Idempotency-Key` was already
        used with a different request; retry with a new key.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "204":
          description: Billing account disconnected.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
        "200":
          description: Dry-run preview of the connection that would be disconnected when `dryRun=true`.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpBillingAccount"
              examples:
                deleteDryRun:
                  summary: Dry-run preview of a billing account disconnect
                  value:
                    id: 012345-6789AB-CDEF01
                    billingAccountId: 012345-6789AB-CDEF01
                    exportProjectId: example-billing-project
                    exportDatasetId: billing_export
                    status: active
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      $ref: "#/components/securitySchemes/BearerAuth"
    BearerAuth:
      description: |
        HTTP Bearer token authentication scheme. Clients pass the token in the
        `Authorization: Bearer <token>` header on every request. Absent or invalid
        token → `401 unauthorized`, plus a `WWW-Authenticate: Bearer
        realm="api.doit.com"` header advertising the required scheme.

        Multi-tenant principals additionally require the `X-Tenant-Id` header
        to disambiguate which customer the request applies to.
      type: http
      scheme: bearer
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Opaque Cloud Connect record identifier returned by create or list.
      schema:
        type: string
        minLength: 1
        maxLength: 256
      example: microsoft-azure-11111111-1111-4111-8111-111111111111
    CleanupScope:
      name: cleanupScope
      in: query
      required: true
      description: Scope of cleanup performed by disconnect. Only `doit_only` is supported; customer cloud IAM resources remain untouched.
      schema:
        type: string
        enum:
          - doit_only
      example: doit_only
    GcpBillingAccountId:
      name: id
      in: path
      required: true
      description: Google Cloud billing account ID, which is also the connection's `id`.
      schema:
        type: string
        pattern: "^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$"
      example: 012345-6789AB-CDEF01
    XTenantIDOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Identifies which DoiT customer tenant a request applies to. Required when
        the caller's auth principal has access to multiple tenants (partners,
        resellers, DoiT-internal operators). Optional for single-customer
        principals — but harmless to include and matches the value the principal
        implicitly resolves to.

        Multi-tenant caller with header absent → `400 tenant_id_required`. Format
        is a stable, opaque customer identifier (the service documents its exact
        shape in the per-endpoint description).
      schema:
        type: string
        examples:
          - tenant_01H5X8Z2AB3CDEFGHJKMNP0QRS
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional variant of the Idempotency-Key envelope for read-like POST
        operations (e.g. bulk-read endpoints exposed as POST because they carry
        a large request body). When provided, the server caches the response for
        a short window and replays it for identical retries; when absent, the
        operation is executed fresh each call.

        UUID v4 or ULID recommended for uniqueness. Max length 255.
      schema:
        type: string
        maxLength: 255
        examples:
          - 01H5X8Z2AB3CDEFGHJKMNP0QRS
    DryRun:
      name: dryRun
      in: query
      description: |
        When `true`, validate the full effect of the operation (auth, quota,
        business rules, downstream feasibility) and return the response body the
        real call would have produced — but persist nothing and dispatch no
        side-effects.

        A dry-run response ships `X-Dry-Run: true` in its headers.
      schema:
        type: boolean
        default: false
        examples:
          - true
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on all side-effecting POST / PATCH / PUT / DELETE operations, and
        on `POST /<resource>/actions/<verb>` action endpoints. The key envelopes
        the request so retries don't double-execute — the server caches the
        response for the key and replays it on subsequent identical requests
        within the cache window.

        UUID v4 or ULID recommended for uniqueness. Max length 255.

        Absent → `400 idempotency_key_required`. Reused with a DIFFERENT request
        body → `422 idempotency_key_reused`. Concurrent replay while the first is
        still processing → `409 idempotency_request_in_progress` (retryable).
      schema:
        type: string
        maxLength: 255
        examples:
          - 01H5X8Z2AB3CDEFGHJKMNP0QRS
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: |
        Required on mutations to Terraform-ready resources. Value is a strong ETag
        echoed back from a prior GET.

        - Match → mutation proceeds; new ETag in the response
        - Mismatch → `412 precondition_failed`
        - Absent → `428 precondition_required`
      schema:
        type: string
        pattern: ^"[!-~]+"$
        examples:
          - "\"7b1c8ff2a3e5\""
  responses:
    RequestTooLarge:
      description: Request payload exceeds the 256 KiB limit.
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestID"
        Content-Language:
          $ref: "#/components/headers/ContentLanguage"
        X-RateLimit-Limit:
          $ref: "#/components/headers/XRateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/XRateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/XRateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequest:
      description: |
        `400 Bad Request`. Request is syntactically malformed or contains a
        parameter combination the server cannot process. The `code` field in
        the Problem Details body identifies the specific error.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: |
        `401 Unauthorized`. Authentication credentials are missing or invalid.
        Ships the WWW-Authenticate header advertising the required scheme.
        Code: `unauthorized`.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: |
        `403 Forbidden`. Caller is authenticated but not permitted to perform this
        action on this resource. Code: `forbidden`.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: |
        `409 Conflict`. The request conflicts with current server state.
        Discriminated on the `code` field into three distinct sub-types:

        - `conflict` — generic conflict (uniqueness violation, state-machine transition
          rejected, etc.)
        - `delete_blocked_by_dependencies` — DELETE would orphan referenced resources;
          remove dependents first
        - `idempotency_request_in_progress` — a prior request with the same
          Idempotency-Key is still processing; retry with backoff (this code is
          `retryable: true`)

        Clients switch on the `code` field to decide the recovery path.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: |
        `429 Too Many Requests`. The caller exceeded the request rate for this
        operation. Discriminated on the `code` field:

        - `rate_limited` — soft throttling; requests are arriving faster than the
          per-window limit permits. `retryable: true` — retry with backoff, but
          only after the `Retry-After` value (or the window reset in
          `X-RateLimit-Reset`) elapses; retrying immediately just re-triggers the
          limit
        - `quota_exceeded` — hard cap on the caller's plan reached; not a
          same-window recovery — the caller must either upgrade or wait for the
          monthly/daily quota to roll over. `retryable: false`

        Always ships `Retry-After` (delay-seconds) and the three `X-RateLimit-*`
        headers so clients can budget precisely.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: |
        `500 Internal Server Error`. Unexpected server-side error; the request
        cannot be attributed to a client mistake. Code: `internal_error` —
        `retryable: true`, so clients SHOULD retry with backoff.

        The trailing path segment of the Problem Details `instance` URI carries
        the Request-Id for support ticketing.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: |
        `503 Service Unavailable`. The service is temporarily unable to handle
        the request — planned maintenance, dependency outage, or backpressure.
        Always ships `Retry-After` (delay-seconds only, NOT HTTP-date) telling
        the client when to try again.

        Code: `service_unavailable` — `retryable: true`; clients MUST honor the
        `Retry-After` value.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableContent:
      description: |
        `422 Unprocessable Content`. Request body is well-formed but semantically
        invalid — the server understood the request but the content violates
        business rules or an idempotency invariant. Discriminated on the `code`
        field:

        - `validation_failed` — field-level rules violated; the `details` array
          in the Problem Details body carries the per-field breakdown
        - `idempotency_key_reused` — same Idempotency-Key was used for a request
          with a DIFFERENT body; retry with a fresh key

        For grammatical / structural rejections (unparseable JSON, wrong types),
        400 is returned instead.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: |
        `404 Not Found`. Resource does not exist or is not visible to the caller —
        the distinction is deliberately not surfaced (revealing existence of
        invisible resources is an information disclosure). Code: `not_found`.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: |
        `412 Precondition Failed`. The `If-Match` ETag does not match the current
        resource ETag — another writer mutated the resource between the client's
        GET and the current mutation. Code: `precondition_failed`.

        Recovery: re-GET the resource to pick up the new ETag, reconcile changes,
        retry with `If-Match` set to the new ETag.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: |
        `415 Unsupported Media Type`. Request `Content-Type` is not one this
        endpoint declares — most commonly a PATCH with a wrong media type. PATCH
        defaults to `application/merge-patch+json`; an endpoint MAY instead
        declare `application/json-patch+json` where resource semantics require
        JSON Patch. Sending any media type the endpoint does not declare (e.g.
        plain `application/json` on a merge-patch endpoint) returns 415.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionRequired:
      description: |
        `428 Precondition Required`. A mutation to a Terraform-ready resource was
        submitted without the mandatory `If-Match` header. Code:
        `precondition_required`.

        Recovery: GET the resource to obtain the current ETag, then retry with
        `If-Match` set to that value.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestID'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ArtifactChange:
      type: object
      additionalProperties: false
      required:
        - action
        - resource
      description: Declarative customer-side cloud change for IaC reconciliation.
      properties:
        action:
          type: string
          example: ensure_role_assignment
        resource:
          type: string
          example: /providers/Microsoft.Management/managementGroups/example-platform
        role:
          type: string
          example: acdd72a7-3385-48ef-bd42-f606fba81ae7
        member:
          type: string
          example: 22222222-2222-4222-8222-222222222222
        values:
          type: array
          items:
            type: string
          example: ['doit-cloud-connect:0123456789abcdef']
    ArtifactFile:
      type: object
      additionalProperties: false
      required:
        - path
        - url
        - sha256
      description: Published template or script file referenced by a deployment artifact.
      properties:
        path:
          type: string
          example: member.yml
        url:
          type: string
          format: uri
          example: https://example.com/member.yml
        sha256:
          type: string
          example: 3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
    AzureRoleRequirement:
      type: object
      additionalProperties: false
      required:
        - name
        - roleDefinitionId
      description: Required Azure built-in role at the management group scope.
      properties:
        name:
          type: string
          example: Reader
        roleDefinitionId:
          type: string
          format: uuid
          example: acdd72a7-3385-48ef-bd42-f606fba81ae7
    BaselineChecks:
      type: object
      additionalProperties: false
      required:
        - status
      description: Latest background health check status.
      properties:
        status:
          type: string
          enum:
            - passed
            - partial
            - failed
            - not_checked
          example: passed
        checkTime:
          type:
            - string
            - "null"
          format: date-time
          example: "2026-11-23T12:00:00Z"
    CleanupResource:
      type: object
      additionalProperties: false
      required:
        - kind
        - target
      description: Resource affected by disconnect cleanup.
      properties:
        kind:
          type: string
          example: s3_notification
        target:
          type: string
          example: example-cloudtrail-bucket
        status:
          type: string
          example: would_remove
    CloudCleanup:
      type: object
      additionalProperties: false
      required:
        - scope
        - resources
      description: Summary of DoiT-side cleanup planned for a disconnect preview.
      properties:
        scope:
          type: string
          enum:
            - doit_only
          example: doit_only
        resources:
          type: array
          items:
            $ref: "#/components/schemas/CleanupResource"
    FollowUp:
      type: object
      additionalProperties: false
      required:
        - bindingId
        - kind
        - status
      description: Backend follow-up step tracked for a connection revision.
      properties:
        bindingId:
          type: string
          example: binding_aws_account_123456789012
        featureId:
          type:
            - string
            - "null"
          example: real-time-data
        kind:
          type: string
          example: enable_feature_consumers
        status:
          type: string
          enum:
            - not_started
            - running
            - succeeded
            - failed
            - would_run
          example: succeeded
        lastError:
          oneOf:
            - $ref: "#/components/schemas/StepError"
            - type: "null"
    GcpBigQueryFinOpsInputs:
      type: object
      additionalProperties: false
      description: BigQuery dataset configuration for the `bigquery-finops` feature.
      example:
        location: US
      properties:
        location:
          type:
            - string
            - "null"
          minLength: 1
          description: >-
            BigQuery location where the FinOps log-sink dataset is created (defaults to `US`). Validated server-side against the active catalog's supported BigQuery locations; pass `null` on `PATCH` to clear the override.
          example: US
    GcpBillingAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - billingAccountId
        - status
      description: |
        Google Cloud billing account connection. It cannot be changed in place,
        so it carries no `etag` and disconnecting it takes no `If-Match`.
      properties:
        id:
          type: string
          readOnly: true
          pattern: "^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$"
          description: Stable resource identifier, equal to `billingAccountId`.
          x-doit-confidentiality: customer-data
          example: 012345-6789AB-CDEF01
        billingAccountId:
          type: string
          pattern: "^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$"
          description: Google Cloud billing account ID.
          x-doit-confidentiality: customer-data
          example: 012345-6789AB-CDEF01
        exportProjectId:
          type: string
          description: |
            Google Cloud project holding the detailed usage cost export dataset.
            Absent only on a `failed` connection whose export is no longer known,
            after a disconnect that removed its records did not complete.
          x-doit-confidentiality: customer-data
          example: example-billing-project
        exportDatasetId:
          type: string
          description: |
            BigQuery dataset the detailed usage cost export writes to. Absent
            whenever `exportProjectId` is absent.
          x-doit-confidentiality: customer-data
          example: billing_export
        status:
          type: string
          readOnly: true
          enum:
            - pending
            - active
            - failed
          description: |
            Activation state. `pending` while DoiT activates the connection in
            the background, `active` once billing import is set up, `failed`
            with `failureReason` when activation or a disconnect did not
            finish. A `failed` connection can be connected again.
          example: active
        failureReason:
          type: string
          readOnly: true
          description: Why the connection is `failed` and what to do next. Present only when `status` is `failed`.
          x-doit-confidentiality: customer-data
          example: DoiT could not finish checking the billing export, which is a problem on DoiT's side; connect again in a few minutes
    GcpBillingAccountCreate:
      type: object
      additionalProperties: false
      required:
        - billingAccountId
        - exportProjectId
        - exportDatasetId
      description: Request payload to connect a Google Cloud billing account.
      properties:
        billingAccountId:
          type: string
          pattern: "^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$"
          description: Google Cloud billing account ID. Cannot be changed in place; disconnect and connect again.
          x-doit-confidentiality: customer-data
          example: 012345-6789AB-CDEF01
        exportProjectId:
          type: string
          pattern: "^([a-z][a-z0-9.-]{0,61}:)?[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          description: Google Cloud project holding the detailed usage cost export dataset. Cannot be changed in place; disconnect and connect again.
          x-doit-confidentiality: customer-data
          example: example-billing-project
        exportDatasetId:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "^[A-Za-z0-9_]+$"
          description: BigQuery dataset the detailed usage cost export writes to. Cannot be changed in place; disconnect and connect again.
          x-doit-confidentiality: customer-data
          example: billing_export
    GcpBillingGrant:
      type: object
      additionalProperties: false
      required:
        - role
        - target
      description: IAM role the customer grants to DoiT's service account before connecting.
      properties:
        role:
          type: string
          description: Google Cloud IAM role to grant.
          example: roles/billing.viewer
        target:
          type: string
          enum:
            - billing_account
            - export_dataset
          description: Where to grant the role. `billing_account` is the billing account being connected; `export_dataset` is the BigQuery dataset holding its detailed usage cost export.
          example: billing_account
    GcpBillingRequirementsResponse:
      type: object
      additionalProperties: false
      required:
        - serviceAccountEmail
        - grants
        - prerequisites
      description: GCP billing onboarding requirements for the authenticated customer.
      properties:
        serviceAccountEmail:
          type: string
          format: email
          description: DoiT service account that reads the billing account and its export.
          x-doit-confidentiality: customer-data
          example: billing-reader@example-project.iam.gserviceaccount.com
        grants:
          type: array
          items:
            $ref: "#/components/schemas/GcpBillingGrant"
          description: IAM roles to grant to `serviceAccountEmail` before connecting, always in this order.
          example:
            - role: roles/billing.viewer
              target: billing_account
            - role: roles/bigquery.dataViewer
              target: export_dataset
        prerequisites:
          type: array
          items:
            type: string
          description: Setup steps Google offers no API for, to complete before connecting.
          example:
            - Enable the Cloud Billing detailed usage cost export to a BigQuery dataset before connecting.
    GcpCloudConnectConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - etag
        - revision
        - scopeKind
        - serviceAccount
        - bindingId
        - featureIds
        - registration
        - baselineChecks
        - featureVerification
        - followUps
      description: >-
        Registered Google Cloud Connect resource. Each Google Cloud service account (`serviceAccount.uniqueId`) holds at most one connection (`409 onboarding.connection_exists` when registering a second scope with the same service account).
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque connection identifier.
          example: google-cloud-100000000000000000001
        etag:
          type: string
          readOnly: true
          pattern: '^"[!-~]+"$'
          description: >-
            Strong ETag matching the `ETag` response header for this GCP connection. Derived solely from configuration `revision` and document incarnation; background health checks, `verify` runs, and follow-up transitions do not change `etag`.
          example: '"1.b7c2d9e0"'
        revision:
          type: string
          readOnly: true
          description: Opaque configuration revision.
          example: "1"
        scopeKind:
          type: string
          enum:
            - gcp_organization
            - gcp_project
            - gcp_dataset
          description: Google Cloud resource scope kind.
          example: gcp_project
        organizationId:
          type:
            - string
            - "null"
          pattern: "^[1-9][0-9]{0,24}$"
          description: Numeric GCP organization ID when `scopeKind` is `gcp_organization`, otherwise `null`.
          x-doit-confidentiality: customer-data
          example:
        projectId:
          type:
            - string
            - "null"
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          description: GCP project ID when `scopeKind` is `gcp_project` or `gcp_dataset`, otherwise `null`.
          x-doit-confidentiality: customer-data
          example: example-project
        datasetId:
          type:
            - string
            - "null"
          pattern: "^[A-Za-z0-9_]+$"
          maxLength: 1024
          description: BigQuery dataset ID when `scopeKind` is `gcp_dataset`, otherwise `null`.
          x-doit-confidentiality: customer-data
          example:
        serviceAccount:
          $ref: "#/components/schemas/GcpServiceAccount"
        roleId:
          type:
            - string
            - "null"
          pattern: "^[A-Za-z0-9_.]{3,64}$"
          description: GCP IAM custom role ID associated with this connection, when recorded.
          x-doit-confidentiality: customer-data
          example: doit_cmp_role
        bindingId:
          type: string
          readOnly: true
          description: >-
            Read-only deterministic GCP scope binding key used to correlate entries in `followUps`, `plannedFollowUps`, and verification `checks` back to this connection.
          example: binding_gcp_project_0123456789abcdef0123456789abcdef
        featureIds:
          type: array
          format: set
          uniqueItems: true
          items:
            type: string
          description: >-
            Cloud Connect feature IDs enabled on this GCP scope, returned sorted in lexicographical ascending order (set semantics).
          example: [core, cloud-diagrams]
        featureInputs:
          oneOf:
            - $ref: "#/components/schemas/GcpFeatureInputs"
            - type: "null"
          description: Typed per-feature inputs stored on this GCP connection, or `null` when none are set.
          example:
        catalogVersion:
          type:
            - string
            - "null"
          description: >-
            Server catalog version recorded when this GCP connection was last created or patched (unchanged by `verify`, which records its own version under `featureVerification.catalogVersion`), or `null` for legacy records not yet mutated via v2.
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
        registeredVia:
          type: string
          readOnly: true
          enum:
            - api
            - console
            - cloudformation_callback
          description: Writer that created the current record.
          example: api
        clientUserAgent:
          type:
            - string
            - "null"
          readOnly: true
          description: Bounded User-Agent of the client that last mutated the record.
          example: terraform-provider-doit/1.6.0
        registration:
          allOf:
            - $ref: "#/components/schemas/Registration"
          readOnly: true
          example:
            status: registered
            registrationTime: "2026-11-23T12:00:00Z"
        baselineChecks:
          allOf:
            - $ref: "#/components/schemas/BaselineChecks"
          readOnly: true
          example:
            status: passed
            checkTime: "2026-11-23T12:00:00Z"
        featureVerification:
          allOf:
            - $ref: "#/components/schemas/VerificationSummary"
          readOnly: true
          example:
            status: not_checked
        followUps:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/FollowUp"
          example: []
    GcpCloudConnectConnectionCreate:
      type: object
      additionalProperties: false
      required:
        - scopeKind
        - serviceAccount
        - featureIds
      description: |
        Request body to register a Google Cloud Connect connection. Set
        `organizationId` for `gcp_organization`, `projectId` for `gcp_project`,
        or `projectId` and `datasetId` for `gcp_dataset`. Scope fields,
        `serviceAccount`, and `roleId` are immutable after creation.
      properties:
        scopeKind:
          type: string
          enum:
            - gcp_organization
            - gcp_project
            - gcp_dataset
          description: Google Cloud resource scope kind. Immutable after creation.
          example: gcp_project
        organizationId:
          type:
            - string
            - "null"
          pattern: "^[1-9][0-9]{0,24}$"
          description: Numeric GCP organization ID when `scopeKind` is `gcp_organization`.
          x-doit-confidentiality: customer-data
          example: "123456789012"
        projectId:
          type:
            - string
            - "null"
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          description: GCP project ID when `scopeKind` is `gcp_project` or `gcp_dataset`.
          x-doit-confidentiality: customer-data
          example: example-project
        datasetId:
          type:
            - string
            - "null"
          pattern: "^[A-Za-z0-9_]+$"
          maxLength: 1024
          description: BigQuery dataset ID when `scopeKind` is `gcp_dataset`.
          x-doit-confidentiality: customer-data
          example: billing_export
        serviceAccount:
          $ref: "#/components/schemas/GcpServiceAccount"
        roleId:
          type:
            - string
            - "null"
          pattern: "^[A-Za-z0-9_.]{3,64}$"
          description: >-
            Optional custom GCP IAM role ID created for this connection (create-only; immutable on PATCH). Defaults to `doit_cmp_role` for organization/project scopes or a dataset-scoped default for `gcp_dataset`.
          example: doit_cmp_role
        featureIds:
          type: array
          format: set
          uniqueItems: true
          minItems: 1
          items:
            type: string
          description: >-
            GCP Cloud Connect feature IDs to enable (set semantics; duplicates return `400 validation_failed`, stored and returned sorted ascending). Valid IDs are dynamic per customer and scope; discover them by calling `resolveGcpCloudConnectRequirements` without `featureIds`.
          example: [core, cloud-diagrams]
        featureInputs:
          oneOf:
            - $ref: "#/components/schemas/GcpFeatureInputs"
            - type: "null"
          description: Optional typed per-feature inputs (for example `bigqueryFinops.location`).
          example:
        catalogVersion:
          type:
            - string
            - "null"
          description: >-
            Optional catalog version from `resolveGcpCloudConnectRequirements` for an optimistic freshness check (`409 onboarding.catalog_version_stale` if stale). Whether supplied or omitted, the server persists the current active catalog version on the GCP connection; IaC providers should treat this as a write-only or computed precondition rather than a drift-tracked configured attribute.
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
    GcpCloudConnectConnectionPatch:
      type: object
      additionalProperties: false
      description: JSON Merge Patch body to update desired features or feature inputs on a GCP Cloud Connect connection.
      properties:
        featureIds:
          type: array
          format: set
          uniqueItems: true
          minItems: 1
          items:
            type: string
          description: >-
            Full replacement set of desired GCP feature IDs (duplicates return `400 validation_failed`; stored and returned sorted ascending). Discover valid IDs via `resolveGcpCloudConnectRequirements`.
          example: [core, cloud-diagrams]
        featureInputs:
          oneOf:
            - $ref: "#/components/schemas/GcpFeatureInputs"
            - type: "null"
          description: Typed per-feature inputs merged into existing GCP inputs (set a property or `featureInputs` to `null` to clear; inputs for deselected features are dropped).
          example:
        catalogVersion:
          type:
            - string
            - "null"
          description: >-
            Optional catalog version from `resolveGcpCloudConnectRequirements` for an optimistic freshness check (`409 onboarding.catalog_version_stale` if stale); the server always records its current active catalog version on commit.
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
    GcpCloudConnectConnectionPreview:
      type: object
      additionalProperties: false
      required:
        - id
        - etag
        - revision
        - scopeKind
        - serviceAccount
        - bindingId
        - featureIds
        - registration
        - baselineChecks
        - featureVerification
        - followUps
      description: >-
        Dry-run preview of a GCP Cloud Connect connection returned by `createGcpCloudConnectConnection` with `dryRun=true` and `X-Dry-Run: true`. Server-generated identity fields (`id`, `etag`, `revision`) are `null`.
      properties:
        id:
          type:
            - string
            - "null"
          readOnly: true
          description: Always `null` on a create dry-run preview.
          example:
        etag:
          type:
            - string
            - "null"
          readOnly: true
          description: Always `null` on a create dry-run preview.
          example:
        revision:
          type:
            - string
            - "null"
          readOnly: true
          description: Always `null` on a create dry-run preview.
          example:
        scopeKind:
          type: string
          enum:
            - gcp_organization
            - gcp_project
            - gcp_dataset
          description: Google Cloud resource scope kind.
          example: gcp_project
        organizationId:
          type:
            - string
            - "null"
          pattern: "^[1-9][0-9]{0,24}$"
          description: Numeric GCP organization ID when `scopeKind` is `gcp_organization`, otherwise `null`.
          x-doit-confidentiality: customer-data
          example:
        projectId:
          type:
            - string
            - "null"
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          description: GCP project ID when `scopeKind` is `gcp_project` or `gcp_dataset`, otherwise `null`.
          x-doit-confidentiality: customer-data
          example: example-project
        datasetId:
          type:
            - string
            - "null"
          pattern: "^[A-Za-z0-9_]+$"
          maxLength: 1024
          description: BigQuery dataset ID when `scopeKind` is `gcp_dataset`, otherwise `null`.
          x-doit-confidentiality: customer-data
          example:
        serviceAccount:
          $ref: "#/components/schemas/GcpServiceAccount"
        roleId:
          type:
            - string
            - "null"
          pattern: "^[A-Za-z0-9_.]{3,64}$"
          description: GCP IAM custom role ID associated with this connection, when recorded.
          x-doit-confidentiality: customer-data
          example: doit_cmp_role
        bindingId:
          type: string
          readOnly: true
          description: Deterministic GCP scope binding key for this connection.
          example: binding_gcp_project_0123456789abcdef0123456789abcdef
        featureIds:
          type: array
          format: set
          uniqueItems: true
          items:
            type: string
          description: GCP Cloud Connect feature IDs that would be enabled, sorted ascending (set semantics).
          example: [core, cloud-diagrams]
        featureInputs:
          oneOf:
            - $ref: "#/components/schemas/GcpFeatureInputs"
            - type: "null"
          description: Typed per-feature inputs that would be stored, or `null` when none are set.
          example:
        catalogVersion:
          type:
            - string
            - "null"
          description: Active server catalog version that would be recorded on commit.
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
        registeredVia:
          type: string
          readOnly: true
          enum:
            - api
            - console
            - cloudformation_callback
          description: Writer that would create the record.
          example: api
        clientUserAgent:
          type:
            - string
            - "null"
          readOnly: true
          description: Bounded User-Agent of the calling client.
          example: terraform-provider-doit/1.6.0
        registration:
          allOf:
            - $ref: "#/components/schemas/Registration"
          readOnly: true
          example:
            status: registered
            registrationTime: null
        baselineChecks:
          allOf:
            - $ref: "#/components/schemas/BaselineChecks"
          readOnly: true
          example:
            status: passed
            checkTime: null
        featureVerification:
          allOf:
            - $ref: "#/components/schemas/VerificationSummary"
          readOnly: true
          example:
            status: not_checked
        followUps:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/FollowUp"
          example: []
    GcpFeatureInputs:
      type: object
      additionalProperties: false
      description: Typed per-feature inputs for Google Cloud Connect features.
      example:
        bigqueryFinops:
          location: US
      properties:
        bigqueryFinops:
          oneOf:
            - $ref: "#/components/schemas/GcpBigQueryFinOpsInputs"
            - type: "null"
          description: BigQuery dataset inputs for the `bigquery-finops` feature, or `null` on `PATCH` to remove them.
          example:
            location: US
    GcpRequirementsRequest:
      type: object
      additionalProperties: false
      required:
        - scopeKind
      description: Request body to resolve Google Cloud Connect requirements.
      properties:
        scopeKind:
          type: string
          enum:
            - gcp_organization
            - gcp_project
            - gcp_dataset
          example: gcp_project
        organizationId:
          type: string
          pattern: "^[1-9][0-9]{0,24}$"
          x-doit-confidentiality: customer-data
          example: "123456789012"
        projectId:
          type: string
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          x-doit-confidentiality: customer-data
          example: example-project
        datasetId:
          type: string
          pattern: "^[A-Za-z0-9_]+$"
          maxLength: 1024
          x-doit-confidentiality: customer-data
          example: billing_export
        featureIds:
          type: array
          format: set
          uniqueItems: true
          items:
            type: string
          example: [core, cloud-diagrams]
        featureInputs:
          $ref: "#/components/schemas/GcpFeatureInputs"
        identityInputs:
          description: Optional GCP service-account placement inputs (`projectId` required for organization scope; `serviceAccountId` required for dataset scope).
          allOf:
            - $ref: '#/components/schemas/GcpRequirementsRequestIdentityInputs'
    GcpRequirementsRequestIdentityInputs:
      type: object
      additionalProperties: false
      description: Optional GCP service-account placement inputs (`projectId` required for organization scope; `serviceAccountId` required for dataset scope).
      properties:
        projectId:
          type: string
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          x-doit-confidentiality: customer-data
          example: example-host-project
        serviceAccountId:
          type: string
          pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          x-doit-confidentiality: customer-data
          example: doit-cmp
        roleId:
          type: string
          pattern: "^[A-Za-z0-9_.]{3,64}$"
