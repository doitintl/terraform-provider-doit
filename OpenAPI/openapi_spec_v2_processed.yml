openapi: 3.1.0
info:
  title: Cloud Connect Onboarding API
  version: "2.0.0"
  contact:
    name: DoiT Applied FinOps
  license:
    name: Proprietary
    url: https://www.doit.com/terms
  description: |
    Per-provider Cloud Connect onboarding for AWS, Google Cloud, and Microsoft
    Azure: resolve customer-specific prerequisites and deployment artifacts,
    register and update Cloud Connect access, disconnect DoiT records, and run
    synchronous access verification checks.

    **Authentication.** `Authorization: Bearer <token>` with the `Settings`
    permission for Cloud Connect routes, or the `Billing Profiles` permission
    for Billing routes, plus the matching cloud integration entitlement
    (`pdi:aws`, `pdi:gcp`, or `pdi:azure`). `ephemeral_pinned` tokens are
    rejected.

    **Tenancy.** Every request resolves to one customer from the verified
    credential. No customer identifier appears in any path or body. Callers
    with access to multiple customers pass `X-Tenant-Id`.

    **Concurrency and Idempotency.** Side-effecting writes require
    `Idempotency-Key`. Cloud Connect updates (`PATCH` with
    `application/merge-patch+json`) and deletes require `If-Match` carrying the strong `etag` returned by the
    latest read or write. `etag` tracks only desired-configuration `revision`
    and document incarnation; background health checks, `verify` calls, and
    follow-up transitions do not increment `revision` or invalidate `etag`.
    Missing `If-Match` returns `428 precondition_required`; a stale ETag
    returns `412 precondition_failed`.

    **Errors.** Every error uses RFC 9457 Problem Details
    (`application/problem+json`) with core or `onboarding.*` codes and
    structured `details[]`:
    - `onboarding.provider_unsupported` (`400`) — provider is not supported by this operation.
    - `onboarding.request_too_large` (`413`) — request body exceeds the service size limit.
    - `onboarding.aws_asset_not_associated` (`422`) — AWS account has no associated DoiT billing asset.
    - `onboarding.registration_gate_failed` (`422`) — cloud access or precondition gate failed before commit.
      Returns `retryable: true` (and is not cached by idempotency) when all failure details are
      propagation-sensitive cloud auth/permission checks (`identity_authentication_failed`,
      `service_account_impersonation_failed`, `azure_application_authentication_failed`, `required_permission_missing`,
      `azure_permissions_incomplete`); structural failures (`aws_asset_not_associated`,
      `gcp_identity_ownership_required`, `azure_customer_binding_required`) return `retryable: false`.
      Expected propagation windows: AWS ~2m, GCP 2–7m+, Azure up to 10m+.
    - `onboarding.connection_exists` (`409`) — a connection is already registered (one per AWS account,
      one per GCP `serviceAccount.uniqueId`, one management-group connection per Azure tenant).
    - `onboarding.catalog_version_stale` (`409`) — supplied `catalogVersion` no longer matches the active catalog.
    - `onboarding.connection_busy` (`409`, retryable) — a follow-up step is currently in flight for this connection.
    - `onboarding.cleanup_failed` (`409`, retryable) — disconnect cleanup failed before record removal.
    - `onboarding.follow_up_failed` (`409`, retryable) — post-commit follow-up step failed.
    - `onboarding.connection_ambiguous` (`409`) — multiple matching records exist for the requested scope.
    - `onboarding.identity_mismatch` (`409`) — target scope identity conflicts with an existing registration.
    - `onboarding.billing_account_already_connected` (`409`) — GCP billing account already has a DoiT billing connection.
    - `onboarding.billing_connection_export_mismatch` (`409`) — GCP billing account is already connected with a different export.
    - `onboarding.billing_connection_activating` (`409`, retryable) — GCP billing connection is still activating.
    - `onboarding.billing_account_busy` (`409`, retryable) — another connect or disconnect of the GCP billing account is running.
    - `onboarding.billing_account_access_missing` (`422`, retryable) — DoiT's service account cannot read the GCP billing account yet.
    - `onboarding.billing_export_not_ready` (`422`, retryable) — DoiT's service account cannot read the GCP billing export table yet.
servers:
  - url: https://api.doit.com
    description: DoiT production API
security:
  - bearerAuth: []
tags:
  - name: AWS Cloud Connect
    description: Resolve prerequisites and manage AWS account Cloud Connect access.
  - name: Azure Cloud Connect
    description: Resolve prerequisites and manage Microsoft Azure management-group Cloud Connect access.
  - name: GCP Billing
    description: Resolve prerequisites and manage Google Cloud billing account connections.
  - name: GCP Cloud Connect
    description: Resolve prerequisites and manage Google Cloud organization, project, and dataset Cloud Connect access.
paths:
  /onboarding/v2/cloud-connect/gcp/requirements:
    post:
      operationId: resolveGcpCloudConnectRequirements
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Cloud Connect
      summary: Resolve GCP Cloud Connect requirements
      description: |
        Resolves customer-specific Google Cloud prerequisites, keyless service
        account delegation, scoped IAM permissions, and setup artifacts for a
        GCP organization, project, or BigQuery dataset. Read-only.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: Google Cloud scope, optional identity hints, and optional feature selection to evaluate.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GcpRequirementsRequest"
            examples:
              project:
                summary: Project-scoped GCP requirements
                value:
                  scopeKind: gcp_project
                  projectId: my-gcp-project
                  featureIds: [core]
      responses:
        "200":
          description: Resolved GCP Cloud Connect requirements and deployment artifacts.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpRequirementsResponse"
              examples:
                project:
                  summary: Resolved GCP project requirements
                  value:
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    scopeKind: gcp_project
                    organizationId: null
                    projectId: my-gcp-project
                    datasetId: null
                    preconditions:
                      status: satisfied
                      findings: []
                    identity:
                      status: resolved
                      kind: gcp_service_account
                      serviceAccountEmail: doit-cloud-connect@my-gcp-project.iam.gserviceaccount.com
                    features:
                      - id: core
                        status: available
                        requirementsSatisfied: true
                    artifacts:
                      - artifactId: gcp-gcloud-setup
                        kind: shell
                        registration: manual
                        requirementsSatisfied: true
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /onboarding/v2/cloud-connect/gcp/connections:
    post:
      operationId: createGcpCloudConnectConnection
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Cloud Connect
      summary: Register a GCP Cloud Connect connection
      description: |
        Registers a keyless Google Cloud service account for organization,
        project, or BigQuery dataset Cloud Connect access. Each Google Cloud
        service account (`serviceAccount.uniqueId`) holds at most one GCP
        connection; registering a second scope with the same service account
        returns `409 onboarding.connection_exists`. `scopeKind`,
        `organizationId`, `projectId`, `datasetId`, and `serviceAccount` are
        immutable after creation. With `dryRun=true`, runs the live
        authentication and permission checks without persisting and returns
        `200` with `GcpCloudConnectConnectionPreview` and `X-Dry-Run: true`, or
        `422 onboarding.registration_gate_failed` if a gate fails.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: Google Cloud scope, keyless service account identity, and feature selection to register.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GcpCloudConnectConnectionCreate"
            examples:
              project:
                summary: Register GCP project connection
                value:
                  scopeKind: gcp_project
                  projectId: my-gcp-project
                  serviceAccount:
                    email: doit-cloud-connect@my-gcp-project.iam.gserviceaccount.com
                    uniqueId: "114422334455667788990"
                    projectId: my-gcp-project
                  featureIds: [core]
      responses:
        "201":
          description: GCP Cloud Connect connection registered.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpCloudConnectConnection"
              examples:
                created:
                  summary: Created GCP Cloud Connect connection
                  value:
                    id: google-cloud-114422334455667788990
                    etag: '"1.c5d8e2f1"'
                    revision: "1"
                    scopeKind: gcp_project
                    organizationId: null
                    projectId: my-gcp-project
                    datasetId: null
                    serviceAccount:
                      email: doit-cloud-connect@my-gcp-project.iam.gserviceaccount.com
                      uniqueId: "114422334455667788990"
                      projectId: my-gcp-project
                    bindingId: binding_gcp_project_my-gcp-project
                    featureIds: [core]
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: "2026-11-23T12:00:00Z"
                    baselineChecks:
                      status: passed
                      checkTime: "2026-11-23T12:00:00Z"
                    featureVerification:
                      status: not_checked
                    followUps: []
        "200":
          description: "Dry-run preview when `dryRun=true` (`X-Dry-Run: true`); generated fields (`id`, `etag`, `revision`) are `null`."
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpCloudConnectConnectionPreview"
              examples:
                dryRun:
                  summary: Ready GCP create dry-run preview
                  value:
                    id: null
                    etag: null
                    revision: null
                    scopeKind: gcp_project
                    organizationId: null
                    projectId: my-gcp-project
                    datasetId: null
                    serviceAccount:
                      email: doit-cloud-connect@my-gcp-project.iam.gserviceaccount.com
                      uniqueId: "114422334455667788990"
                      projectId: my-gcp-project
                    bindingId: binding_gcp_project_my-gcp-project
                    featureIds: [core]
                    featureInputs: null
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: null
                    baselineChecks:
                      status: passed
                      checkTime: null
                    featureVerification:
                      status: not_checked
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /onboarding/v2/cloud-connect/gcp/connections/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getGcpCloudConnectConnection
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Cloud Connect
      summary: Get a GCP Cloud Connect connection
      description: Returns the stored state, desired features, and latest verification summary for a GCP Cloud Connect connection.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
      responses:
        "200":
          description: GCP Cloud Connect connection state.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpCloudConnectConnection"
              examples:
                connection:
                  summary: Registered GCP Cloud Connect connection
                  value:
                    id: google-cloud-114422334455667788990
                    etag: '"1.c5d8e2f1"'
                    revision: "1"
                    scopeKind: gcp_project
                    organizationId: null
                    projectId: my-gcp-project
                    datasetId: null
                    serviceAccount:
                      email: doit-cloud-connect@my-gcp-project.iam.gserviceaccount.com
                      uniqueId: "114422334455667788990"
                      projectId: my-gcp-project
                    bindingId: binding_gcp_project_my-gcp-project
                    featureIds: [core]
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: "2026-11-23T12:00:00Z"
                    baselineChecks:
                      status: passed
                      checkTime: "2026-11-23T12:00:00Z"
                    featureVerification:
                      status: not_checked
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateGcpCloudConnectConnection
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Cloud Connect
      summary: Update a GCP Cloud Connect connection
      description: |
        Updates desired features for a GCP Cloud Connect connection using RFC
        7396 JSON Merge Patch. Requires `If-Match`. When `dryRun=true`, returns
        the projected resource with `X-Dry-Run: true` without mutating state.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IfMatchRequired"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: RFC 7396 JSON Merge Patch updating enabled GCP features.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/GcpCloudConnectConnectionPatch"
            examples:
              updateFeatures:
                summary: Add cloud-diagrams to a GCP connection
                value:
                  featureIds: [core, cloud-diagrams]
      responses:
        "200":
          description: Updated GCP Cloud Connect connection (or projected state when `dryRun=true`).
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcpCloudConnectConnection"
              examples:
                updated:
                  summary: Updated GCP Cloud Connect connection
                  value:
                    id: google-cloud-114422334455667788990
                    etag: '"2.d9e1f3a4"'
                    revision: "2"
                    scopeKind: gcp_project
                    organizationId: null
                    projectId: my-gcp-project
                    datasetId: null
                    serviceAccount:
                      email: doit-cloud-connect@my-gcp-project.iam.gserviceaccount.com
                      uniqueId: "114422334455667788990"
                      projectId: my-gcp-project
                    bindingId: binding_gcp_project_my-gcp-project
                    featureIds: [core, cloud-diagrams]
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: "2026-11-23T12:00:00Z"
                    baselineChecks:
                      status: passed
                      checkTime: "2026-11-23T12:00:00Z"
                    featureVerification:
                      status: not_checked
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteGcpCloudConnectConnection
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - GCP Cloud Connect
      summary: Disconnect a GCP Cloud Connect connection
      description: |
        Removes DoiT's GCP Cloud Connect record using `cleanupScope=doit_only`.
        Does not delete customer GCP service accounts or IAM bindings. Requires
        `If-Match`.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IfMatchRequired"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/CleanupScope"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "204":
          description: GCP Cloud Connect connection disconnected.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
        "200":
          description: Dry-run preview when `dryRun=true`.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
