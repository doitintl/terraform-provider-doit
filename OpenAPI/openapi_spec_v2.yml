        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/RequirementsArtifact"
          example: []
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/RequirementsFollowUp"
          example: []
    AzureRequirementsResponse:
      type: object
      additionalProperties: false
      required:
        - catalogVersion
        - tenantId
        - managementGroupId
        - preconditions
        - identity
        - features
        - artifacts
        - followUps
      description: Resolved Microsoft Azure management-group Cloud Connect requirements.
      properties:
        catalogVersion:
          type: string
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
        tenantId:
          type: string
          x-doit-confidentiality: customer-data
          example: 11111111-1111-4111-8111-111111111111
        managementGroupId:
          type: string
          x-doit-confidentiality: customer-data
          example: example-platform
        preconditions:
          $ref: "#/components/schemas/RequirementsPreconditions"
        identity:
          $ref: "#/components/schemas/RequirementsIdentity"
        features:
          type: array
          items:
            $ref: "#/components/schemas/RequirementsFeature"
          example: []
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/RequirementsArtifact"
          example: []
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/RequirementsFollowUp"
          example: []
    GcpBillingGrant:
      type: object
      additionalProperties: false
      required:
        - role
        - target
      description: IAM role the customer grants to DoiT's service account before connecting.
      properties:
        role:
          type: string
          description: Google Cloud IAM role to grant.
          example: roles/billing.viewer
        target:
          type: string
          enum:
            - billing_account
            - export_dataset
          description: Where to grant the role. `billing_account` is the billing account being connected; `export_dataset` is the BigQuery dataset holding its detailed usage cost export.
          example: billing_account
    GcpBillingRequirementsResponse:
      type: object
      additionalProperties: false
      required:
        - serviceAccountEmail
        - grants
        - prerequisites
      description: GCP billing onboarding requirements for the authenticated customer.
      properties:
        serviceAccountEmail:
          type: string
          format: email
          description: DoiT service account that reads the billing account and its export.
          x-doit-confidentiality: customer-data
          example: billing-reader@example-project.iam.gserviceaccount.com
        grants:
          type: array
          items:
            $ref: "#/components/schemas/GcpBillingGrant"
          description: IAM roles to grant to `serviceAccountEmail` before connecting, always in this order.
          example:
            - role: roles/billing.viewer
              target: billing_account
            - role: roles/bigquery.dataViewer
              target: export_dataset
        prerequisites:
          type: array
          items:
            type: string
          description: Setup steps Google offers no API for, to complete before connecting.
          example:
            - Enable the Cloud Billing detailed usage cost export to a BigQuery dataset before connecting.
    GcpBillingAccountCreate:
      type: object
      additionalProperties: false
      required:
        - billingAccountId
        - exportProjectId
        - exportDatasetId
      description: Request payload to connect a Google Cloud billing account.
      properties:
        billingAccountId:
          type: string
          pattern: "^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$"
          description: Google Cloud billing account ID. Cannot be changed in place; disconnect and connect again.
          x-doit-confidentiality: customer-data
          example: 012345-6789AB-CDEF01
        exportProjectId:
          type: string
          pattern: "^([a-z][a-z0-9.-]{0,61}:)?[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          description: Google Cloud project holding the detailed usage cost export dataset. Cannot be changed in place; disconnect and connect again.
          x-doit-confidentiality: customer-data
          example: example-billing-project
        exportDatasetId:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "^[A-Za-z0-9_]+$"
          description: BigQuery dataset the detailed usage cost export writes to. Cannot be changed in place; disconnect and connect again.
          x-doit-confidentiality: customer-data
          example: billing_export
    GcpBillingAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - billingAccountId
        - status
      description: |
        Google Cloud billing account connection. It cannot be changed in place,
        so it carries no `etag` and disconnecting it takes no `If-Match`.
      properties:
        id:
          type: string
          readOnly: true
          pattern: "^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$"
          description: Stable resource identifier, equal to `billingAccountId`.
          x-doit-confidentiality: customer-data
          example: 012345-6789AB-CDEF01
        billingAccountId:
          type: string
          pattern: "^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$"
          description: Google Cloud billing account ID.
          x-doit-confidentiality: customer-data
          example: 012345-6789AB-CDEF01
        exportProjectId:
          type: string
          description: |
            Google Cloud project holding the detailed usage cost export dataset.
            Absent only on a `failed` connection whose export is no longer known,
            after a disconnect that removed its records did not complete.
          x-doit-confidentiality: customer-data
          example: example-billing-project
        exportDatasetId:
          type: string
          description: |
            BigQuery dataset the detailed usage cost export writes to. Absent
            whenever `exportProjectId` is absent.
          x-doit-confidentiality: customer-data
          example: billing_export
        status:
          type: string
          readOnly: true
          enum:
            - pending
            - active
            - failed
          description: |
            Activation state. `pending` while DoiT activates the connection in
            the background, `active` once billing import is set up, `failed`
            with `failureReason` when activation or a disconnect did not
            finish. A `failed` connection can be connected again.
          example: active
        failureReason:
          type: string
          readOnly: true
          description: Why the connection is `failed` and what to do next. Present only when `status` is `failed`.
          x-doit-confidentiality: customer-data
          example: DoiT could not finish checking the billing export, which is a problem on DoiT's side; connect again in a few minutes
    ProblemDetails:
      description: |
        RFC 9457 Problem Details envelope with DoiT extensions. Every DoiT API
        error response body serializes as this shape. DoiT requires several
        fields that RFC 9457 marks optional (`type`, `detail`, `instance`) and
        adds the extensions `code`, `retryable`, `details`, `docsUrl`.
        Consumers MUST tolerate unknown fields — new members may be added in a
        non-breaking way.
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - retryable
      properties:
        type:
          description: |
            Per RFC 9457 §3.1. Dereferenceable URI identifying the problem class.
            DoiT convention is `https://developer.doit.com/errors/<code>` — for
            service-specific codes the dotted code is a single path segment,
            e.g. `https://developer.doit.com/errors/cloudflow.execution_deadlock`.
          type: string
          format: uri
          examples:
            - https://developer.doit.com/errors/validation_failed
        title:
          description: |
            Short, human-readable summary of the problem class. Stable enough for
            docs, but consumers must not branch on it — branch on `code` instead.
          type: string
          examples:
            - The request body or parameters failed validation
        status:
          description: |
            The HTTP status code originally generated by the origin server for
            this occurrence of the problem. Matches the response's HTTP status.
          type: integer
          minimum: 100
          maximum: 599
          examples:
            - 400
        detail:
          description: |
            Human-readable explanation specific to this occurrence. English,
            present tense, complete sentence.
          type: string
          examples:
            - sortBy must be one of [create_time, update_time, name, status]; got 'foo'
        instance:
          description: |
            Per RFC 9457 §3.1 with a DoiT-specific shape: a URI of the form
            `https://api.doit.com/requests/{requestId}`. The trailing path
            segment is the DoiT request ID (`req_<ULID>`) and MUST equal the
            Request-Id response header — the request ID is derived from
            `instance`, never duplicated in a separate payload field. Not
            guaranteed to be dereferenceable by external clients.
          type: string
          format: uri
          examples:
            - https://api.doit.com/requests/req_01H5X8Z2AB3CDEFGHJKMNP0QRS
        code:
          description: |
            DoiT extension. Stable machine-readable identifier for the error:
            either a core DoiT code (`lower_snake_case`) or a service-specific
            code in the `<service>.<code>` namespace (kebab-case service path
            segment, dot, `lower_snake_case` suffix).
          type: string
          pattern: ^([a-z][a-z0-9_]*|[a-z][a-z0-9]*(?:-[a-z0-9]+)*\.[a-z][a-z0-9_]*)$
          examples:
            - validation_failed
        retryable:
          description: |
            DoiT extension. When true, the client SHOULD retry with backoff.
            When false, retrying will not succeed without changing the request.
          type: boolean
          examples:
            - false
        details:
          description: |
            DoiT extension. Optional structured breakdown when the top-level `detail`
            needs field-level context. Strongly recommended on 400/422 responses;
            clients SHOULD treat as advisory. Every diagnostic object carries a
            stable snake_case `issue` identifier; objects describing a specific
            request field also carry a `field` JSON pointer or dotted path.
            Additional properties beyond `issue` and `field` are open so each error
            code can attach its own structured context (the unsupported key, the
            conflicting blockers, the rejected value).
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - issue
            properties:
              issue:
                type: string
                pattern: ^[a-z][a-z0-9_]*$
                description: Stable snake_case identifier for the specific diagnostic
                examples:
                  - value_not_in_enum
              field:
                type: string
                description: JSON pointer or dotted path to the offending field, when applicable
                examples:
                  - sortBy
        docsUrl:
          description: |
            DoiT extension. Human-facing documentation page explaining causes and
            remedies; MAY be more specific than `type` for context-specific
            guidance.
          type:
            - string
            - "null"
          format: uri
          examples:
            - https://developer.doit.com/docs/errors/validation_failed
      examples:
        - type: https://developer.doit.com/errors/validation_failed
          title: The request body or parameters failed validation
          status: 400
          detail: "sortBy: field not sortable on this endpoint"
          instance: https://api.doit.com/requests/req_01H5X8Z2AB3CDEFGHJKMNP0QRS
          code: validation_failed
          retryable: false
          details:
            - issue: value_not_in_enum
              field: sortBy
              allowed: [create_time, update_time, name, status]
          docsUrl: https://developer.doit.com/docs/errors/validation_failed
    ListResponseEnvelope:
      description: |
        Base envelope every list response inherits from: `items` plus the
        optional `pageToken` / `rowCount` pagination fields. The `pageToken` is
        opaque, encodes the sort state, and is rejected on a continuation with
        a mismatched sort (`400 pagination_token_invalid`).
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: |
            Resource instances in the current page. Per-resource schemas replace
            `items[]` with `array<ResourceType>`.
          type: array
          items: {}
        pageToken:
          description: |
            Opaque continuation token. Present only when more results are available;
            absent on the final page. Clients pass this back verbatim as the
            `pageToken` query parameter to fetch the next page.
          type: string
          examples:
            - eyJvZmZzZXQiOjUwLCJzb3J0IjoiY3JlYXRlVGltZSJ9
        rowCount:
          description: |
            Optional best-effort total-count hint. Servers include this when
            computing it is cheap (indexed count) and MAY return `null` or omit it
            for expensive-to-count endpoints. Clients MUST NOT assume this field
            is present or non-null. When present, it is the total across all
            pages, not just the current page.
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          examples:
            - 137
    RequestID:
      description: |
        DoiT request identifier. Every DoiT API response carries this value in
        the Request-Id header; on error responses the same value is the trailing
        path segment of the Problem Details `instance` URI
        (`https://api.doit.com/requests/{requestId}`). The value has the form
        `req_<ULID>` — the tag prefix disambiguates from other ID types when
        both appear in a log line.
      type: string
      pattern: ^req_[0-9A-HJKMNP-TV-Z]{26}$
      minLength: 30
      maxLength: 30
      examples:
        - req_01H5X8Z2AB3CDEFGHJKMNP0QRS
  headers:
    RequestID:
      description: |
        Request-Id for log correlation. Present on every DoiT API response.
        Value has the form `req_<ULID>`. On error responses it equals the
        trailing path segment of the Problem Details `instance` URI — grep on
        this value ties client-side error reports to server-side log entries.
      schema:
        $ref: '#/components/schemas/RequestID'
    ContentLanguage:
      description: |
        RFC 7231 Content-Language header. Present on every DoiT API response;
        identifies the language of any human-readable text in the response.
        Currently `en` only.
      schema:
        type: string
        enum:
          - en
        default: en
        examples:
          - en
      examples: {}
    XRateLimitLimit:
      description: |
        Total quota for the caller's rate-limit window. Present on responses from
        rate-limited endpoints — including successful (2xx) responses, not just
        429s — so clients can budget preemptively. Absent on endpoints not subject
        to rate limiting.
      schema:
        type: integer
        minimum: 0
        examples:
          - 1000
      examples: {}
    XRateLimitRemaining:
      description: |
        Requests remaining in the caller's current rate-limit window. Present on
        responses from rate-limited endpoints, absent on endpoints not subject to
        rate limiting. Reaches 0 at the moment the next request would be rejected
        with `429 rate_limited`.
      schema:
        type: integer
        minimum: 0
        examples:
          - 847
      examples: {}
    XRateLimitReset:
      description: |
        Seconds until the rate-limit window resets (i.e. when `X-RateLimit-Remaining`
        will replenish to `X-RateLimit-Limit`). Delay-seconds form for consistency
        with `Retry-After`; DoiT APIs never emit HTTP-date form.

        Present on responses from rate-limited endpoints, absent on endpoints not
        subject to rate limiting.
      schema:
        type: integer
        minimum: 0
        examples:
          - 42
      examples: {}
    XDryRun:
      description: |
        Set to `true` on responses to dry-run requests (requests made with
        `?dryRun=true`). Lets intermediaries and observability tooling
        distinguish dry-run responses from real ones without inspecting the
        request URL.

        Absent on responses to real (non-dry-run) requests — when present, the
        value is always `true`.
      schema:
        type: boolean
        enum:
          - true
        examples:
          - true
      examples: {}
    ETag:
      description: |
        Strong ETag for optimistic concurrency. DoiT APIs emit strong
        ETags only — weak ETags (`W/"..."`) are not used because RFC 7232 §2.1
        disallows their use in `If-Match` preconditions.

        The same value appears as the `etag` body field on the resource; clients
        MAY use either form.
      schema:
        type: string
        pattern: ^"[!-~]+"$
        examples:
          - "\"7b1c8ff2a3e5\""
      examples: {}
    Location:
      description: |
        URI of the resource created by a `201 Created` response, or the operation
        resource returned by a `202 Accepted` response (long-running action;
        clients poll this URI for completion), per RFC 9110 §10.2.2. Absolute or
        root-relative.
      schema:
        type: string
        format: uri-reference
        examples:
          - /cloudflow/v1/flows/01H5X8Z2AB3CDEFGHJKMNP0QRS
      examples: {}
    WWWAuthenticate:
      description: |
        Advertises the authentication scheme required by the resource, per
        RFC 9110 §11.6.1. Present on every `401 Unauthorized` response. DoiT
        APIs use Bearer token auth; the realm is the API domain.
      schema:
        type: string
        examples:
          - Bearer realm="api.doit.com"
      examples: {}
    RetryAfter:
      description: |
        Retry-After header per RFC 7231 §7.1.3. **Delay-seconds form only** —
        DoiT APIs never emit the HTTP-date form. Present on `429 Too Many Requests`
        and `503 Service Unavailable` responses; overrides the client's local
        backoff schedule for the immediate next attempt.
      schema:
        type: integer
        minimum: 1
        examples:
          - 30
      examples: {}
