openapi: 3.1.0
info:
  title: Cloud Connect Onboarding API
  version: "2.0.0"
  contact:
    name: DoiT Applied FinOps
  license:
    name: Proprietary
    url: https://www.doit.com/terms
  description: |
    Per-provider Cloud Connect onboarding for AWS, Google Cloud, and Microsoft
    Azure: resolve customer-specific prerequisites and deployment artifacts,
    register and update Cloud Connect access, disconnect DoiT records, and run
    synchronous access verification checks.

    **Authentication.** `Authorization: Bearer <token>` with the `Settings`
    permission for Cloud Connect routes, or the `Billing Profiles` permission
    for Billing routes, plus the matching cloud integration entitlement
    (`pdi:aws`, `pdi:gcp`, or `pdi:azure`). `ephemeral_pinned` tokens are
    rejected.

    **Tenancy.** Every request resolves to one customer from the verified
    credential. No customer identifier appears in any path or body. Callers
    with access to multiple customers pass `X-Tenant-Id`.

    **Concurrency and Idempotency.** Side-effecting writes require
    `Idempotency-Key`. Cloud Connect updates (`PATCH` with
    `application/merge-patch+json`) and deletes require `If-Match` carrying the strong `etag` returned by the
    latest read or write. `etag` tracks only desired-configuration `revision`
    and document incarnation; background health checks, `verify` calls, and
    follow-up transitions do not increment `revision` or invalidate `etag`.
    Missing `If-Match` returns `428 precondition_required`; a stale ETag
    returns `412 precondition_failed`.

    **Errors.** Every error uses RFC 9457 Problem Details
    (`application/problem+json`) with core or `onboarding.*` codes and
    structured `details[]`:
    - `onboarding.provider_unsupported` (`400`) — provider is not supported by this operation.
    - `onboarding.request_too_large` (`413`) — request body exceeds the service size limit.
    - `onboarding.aws_asset_not_associated` (`422`) — AWS account has no associated DoiT billing asset.
    - `onboarding.registration_gate_failed` (`422`) — cloud access or precondition gate failed before commit.
      Returns `retryable: true` (and is not cached by idempotency) when all failure details are
      propagation-sensitive cloud auth/permission checks (`identity_authentication_failed`,
      `service_account_impersonation_failed`, `azure_application_authentication_failed`, `required_permission_missing`,
      `azure_permissions_incomplete`); structural failures (`aws_asset_not_associated`,
      `gcp_identity_ownership_required`, `azure_customer_binding_required`) return `retryable: false`.
      Expected propagation windows: AWS ~2m, GCP 2–7m+, Azure up to 10m+.
    - `onboarding.connection_exists` (`409`) — a connection is already registered (one per AWS account,
      one per GCP `serviceAccount.uniqueId`, one management-group connection per Azure tenant).
    - `onboarding.catalog_version_stale` (`409`) — supplied `catalogVersion` no longer matches the active catalog.
    - `onboarding.connection_busy` (`409`, retryable) — a follow-up step is currently in flight for this connection.
    - `onboarding.cleanup_failed` (`409`, retryable) — disconnect cleanup failed before record removal.
    - `onboarding.follow_up_failed` (`409`, retryable) — post-commit follow-up step failed.
    - `onboarding.connection_ambiguous` (`409`) — multiple matching records exist for the requested scope.
    - `onboarding.identity_mismatch` (`409`) — target scope identity conflicts with an existing registration.
    - `onboarding.billing_account_already_connected` (`409`) — GCP billing account already has a DoiT billing connection.
    - `onboarding.billing_connection_export_mismatch` (`409`) — GCP billing account is already connected with a different export.
    - `onboarding.billing_connection_activating` (`409`, retryable) — GCP billing connection is still activating.
    - `onboarding.billing_account_busy` (`409`, retryable) — another connect or disconnect of the GCP billing account is running.
    - `onboarding.billing_account_access_missing` (`422`, retryable) — DoiT's service account cannot read the GCP billing account yet.
    - `onboarding.billing_export_not_ready` (`422`, retryable) — DoiT's service account cannot read the GCP billing export table yet.
servers:
  - url: https://api.doit.com
    description: DoiT production API
security:
  - bearerAuth: []
tags:
  - name: AWS Cloud Connect
    description: Resolve prerequisites and manage AWS account Cloud Connect access.
  - name: Azure Cloud Connect
    description: Resolve prerequisites and manage Microsoft Azure management-group Cloud Connect access.
  - name: GCP Billing
    description: Resolve prerequisites and manage Google Cloud billing account connections.
  - name: GCP Cloud Connect
    description: Resolve prerequisites and manage Google Cloud organization, project, and dataset Cloud Connect access.
paths:
  /onboarding/v2/cloud-connect/aws/requirements:
    post:
      operationId: resolveAwsCloudConnectRequirements
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - AWS Cloud Connect
      summary: Resolve AWS Cloud Connect requirements
      description: |
        Resolves customer-specific AWS Cloud Connect prerequisites, trust
        configuration, per-feature permissions, required inputs, and deployment
        artifacts for an AWS account or AWS Organization root/OU. Read-only.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: AWS scope and optional feature selection to evaluate.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsRequirementsRequest"
            examples:
              account:
                summary: Single AWS account requirements
                value:
                  scopeKind: aws_account
                  accountId: "123456789012"
                  featureIds: [core, quotas]
      responses:
        "200":
          description: Resolved AWS Cloud Connect requirements and deployment artifacts.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsRequirementsResponse"
              examples:
                account:
                  summary: Resolved AWS account requirements
                  value:
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    scopeKind: aws_account
                    accountId: "123456789012"
                    managementAccountId: null
                    targetId: null
                    variant: standalone
                    preconditions:
                      status: satisfied
                      findings: []
                    identity:
                      status: resolved
                      kind: aws_iam_role
                      roleName: doitintl_dci_cloudconnect
                      externalId: example-external-id
                    features:
                      - id: core
                        status: available
                        requirementsSatisfied: true
                    artifacts:
                      - artifactId: aws-cloudformation-account
                        kind: cloudformation
                        registration: callback
                        requirementsSatisfied: true
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /onboarding/v2/cloud-connect/aws/accounts:
    get:
      operationId: listAwsCloudConnectAccounts
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - AWS Cloud Connect
      summary: List AWS Cloud Connect accounts
      description: >-
        Lists registered AWS Cloud Connect accounts for the authenticated customer. Supported `filter` keys: `accountId`, `featureIds` (for example `accountId:123456789012|featureIds:core`).
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/Filter"
          description: |
            Filter as `key:value` pairs, `|` between keys. Supported keys:
            `accountId`, `featureIds`. Example: `accountId:123456789012|featureIds:core`.
            See [Filter](#/components/parameters/Filter) for the full grammar.
        - $ref: "#/components/parameters/MaxResults"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Page of AWS Cloud Connect accounts.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsCloudConnectAccountListResponse"
              examples:
                page:
                  summary: Single AWS account page
                  value:
                    items:
                      - id: amazon-web-services-AROAI1234567890EXAMPLE
                        etag: '"1.b7c2d9e0"'
                        revision: "1"
                        accountId: "123456789012"
                        roleArn: arn:aws:iam::123456789012:role/doitintl_dci_cloudconnect
                        roleId: AROAI1234567890EXAMPLE
                        bindingId: binding_aws_account_123456789012
                        featureIds: [core, quotas]
                        featureInputs: null
                        catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                        registeredVia: api
                        clientUserAgent: terraform-provider-doit/1.6.0
                        registration:
                          status: registered
                          registrationTime: "2026-11-23T12:00:00Z"
                        baselineChecks:
                          status: passed
                          checkTime: "2026-11-23T12:00:00Z"
                        featureVerification:
                          status: passed
                          observationTime: "2026-11-23T12:00:00Z"
                          checkedRevision: "1"
                          catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                        followUps: []
                    rowCount: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createAwsCloudConnectAccount
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - AWS Cloud Connect
      summary: Register an AWS Cloud Connect account
      description: |
        Registers an existing AWS IAM role for Cloud Connect access on one AWS
        account. `accountId` and `roleArn` are immutable after creation; changing
        either requires replacing the connection. Returns `409` if a connection
        already exists for the account. With `dryRun=true`, validates schema,
        catalog, and billing-asset association and returns `200` with
        `AwsCloudConnectAccountPreview` and `X-Dry-Run: true` (skipping live
        `AssumeRole` because the session broker cannot probe an unregistered
        role), or `422 onboarding.registration_gate_failed` if a gate fails.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: AWS IAM role and feature selection to register.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsCloudConnectAccountCreate"
            examples:
              create:
                summary: Register AWS account with core and quotas
                value:
                  accountId: "123456789012"
                  roleArn: arn:aws:iam::123456789012:role/doitintl_dci_cloudconnect
                  featureIds: [core, quotas]
      responses:
        "201":
          description: AWS Cloud Connect account registered.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsCloudConnectAccount"
              examples:
                created:
                  summary: Created AWS Cloud Connect account
                  value:
                    id: amazon-web-services-AROAI1234567890EXAMPLE
                    etag: '"1.b7c2d9e0"'
                    revision: "1"
                    accountId: "123456789012"
                    roleArn: arn:aws:iam::123456789012:role/doitintl_dci_cloudconnect
                    roleId: AROAI1234567890EXAMPLE
                    bindingId: binding_aws_account_123456789012
                    featureIds: [core, quotas]
                    featureInputs: null
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: "2026-11-23T12:00:00Z"
                    baselineChecks:
                      status: passed
                      checkTime: "2026-11-23T12:00:00Z"
                    featureVerification:
                      status: not_checked
                    followUps: []
        "200":
          description: "Dry-run preview when `dryRun=true` (`X-Dry-Run: true`); generated fields (`id`, `etag`, `revision`) are `null`."
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsCloudConnectAccountPreview"
              examples:
                dryRun:
                  summary: Ready AWS create dry-run preview
                  value:
                    id: null
                    etag: null
                    revision: null
                    accountId: "123456789012"
                    roleArn: arn:aws:iam::123456789012:role/doitintl_dci_cloudconnect
                    bindingId: binding_aws_account_123456789012
                    featureIds: [core, quotas]
                    featureInputs: null
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: null
                    baselineChecks:
                      status: not_checked
                      checkTime: null
                    featureVerification:
                      status: not_checked
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /onboarding/v2/cloud-connect/aws/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getAwsCloudConnectAccount
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - AWS Cloud Connect
      summary: Get an AWS Cloud Connect account
      description: Returns the stored state, desired features, and latest verification summary for an AWS Cloud Connect account.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
      responses:
        "200":
          description: AWS Cloud Connect account state.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsCloudConnectAccount"
              examples:
                account:
                  summary: Registered AWS Cloud Connect account
                  value:
                    id: amazon-web-services-AROAI1234567890EXAMPLE
                    etag: '"1.b7c2d9e0"'
                    revision: "1"
                    accountId: "123456789012"
                    roleArn: arn:aws:iam::123456789012:role/doitintl_dci_cloudconnect
                    roleId: AROAI1234567890EXAMPLE
                    bindingId: binding_aws_account_123456789012
                    featureIds: [core, quotas]
                    featureInputs: null
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: "2026-11-23T12:00:00Z"
                    baselineChecks:
                      status: passed
                      checkTime: "2026-11-23T12:00:00Z"
                    featureVerification:
                      status: not_checked
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateAwsCloudConnectAccount
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - AWS Cloud Connect
      summary: Update an AWS Cloud Connect account
      description: |
        Updates desired features or feature inputs for an AWS Cloud Connect
        account using RFC 7396 JSON Merge Patch. Requires `If-Match` with the
        current strong `etag`. When `dryRun=true`, validates the patch and
        returns the projected resource with `X-Dry-Run: true` without mutating
        state.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IfMatchRequired"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        description: RFC 7396 JSON Merge Patch updating AWS features or feature inputs.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AwsCloudConnectAccountPatch"
            examples:
              updateFeatures:
                summary: Add security-hub-insights to an existing AWS account
                value:
                  featureIds: [core, quotas, security-hub-insights]
      responses:
        "200":
          description: Updated AWS Cloud Connect account (or projected state when `dryRun=true`).
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwsCloudConnectAccount"
              examples:
                updated:
                  summary: Updated AWS Cloud Connect account
                  value:
                    id: amazon-web-services-AROAI1234567890EXAMPLE
                    etag: '"2.9a4e1c2f"'
                    revision: "2"
                    accountId: "123456789012"
                    roleArn: arn:aws:iam::123456789012:role/doitintl_dci_cloudconnect
                    roleId: AROAI1234567890EXAMPLE
                    bindingId: binding_aws_account_123456789012
                    featureIds: [core, quotas, security-hub-insights]
                    featureInputs: null
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    registeredVia: api
                    clientUserAgent: terraform-provider-doit/1.6.0
                    registration:
                      status: registered
                      registrationTime: "2026-11-23T12:00:00Z"
                    baselineChecks:
                      status: passed
                      checkTime: "2026-11-23T12:00:00Z"
                    featureVerification:
                      status: not_checked
                    followUps: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteAwsCloudConnectAccount
      x-doit-lifecycle: beta
      x-internal: true
      x-doit-confidentiality: customer-data
      tags:
        - AWS Cloud Connect
      summary: Disconnect an AWS Cloud Connect account
      description: |
        Removes DoiT's AWS Cloud Connect record and DoiT-managed feature
        registrations (such as S3 notifications) using `cleanupScope=doit_only`.
        Does not delete customer IAM roles. Requires `If-Match`.
      parameters:
        - $ref: "#/components/parameters/XTenantIDOptional"
        - $ref: "#/components/parameters/IfMatchRequired"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/CleanupScope"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "204":
          description: AWS Cloud Connect account disconnected.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
        "200":
          description: Dry-run preview when `dryRun=true`.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestID"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            X-Dry-Run:
              $ref: "#/components/headers/XDryRun"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationPreview"
              examples:
                deleteDryRun:
                  summary: Ready AWS disconnect dry-run preview
                  value:
                    operation: delete
                    wouldApply: true
                    catalogVersion: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
                    preconditions: []
                    plannedFollowUps: []
                    findings: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
