          format: set
          uniqueItems: true
          minItems: 1
          items:
            type: string
          description: >-
            Azure Cloud Connect feature IDs to enable (set semantics; duplicates return `400 validation_failed`, stored and returned sorted ascending). Valid IDs are dynamic per customer and scope; discover them by calling `resolveAzureCloudConnectRequirements` without `featureIds`.
          example: [advisor]
        catalogVersion:
          type:
            - string
            - "null"
          description: >-
            Optional catalog version from `resolveAzureCloudConnectRequirements` for an optimistic freshness check (`409 onboarding.catalog_version_stale` if stale). Whether supplied or omitted, the server persists the current active catalog version on the Azure connection; IaC providers should treat this as a write-only or computed precondition rather than a drift-tracked configured attribute.
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
    AzureCloudConnectManagementGroupPatch:
      type: object
      additionalProperties: false
      description: JSON Merge Patch body to update desired features on an Azure Cloud Connect management-group connection.
      properties:
        featureIds:
          type: array
          format: set
          uniqueItems: true
          minItems: 1
          items:
            type: string
          description: >-
            Full replacement set of desired Azure feature IDs (duplicates return `400 validation_failed`; stored and returned sorted ascending). Discover valid IDs via `resolveAzureCloudConnectRequirements`.
          example: [advisor, composer]
        catalogVersion:
          type:
            - string
            - "null"
          description: >-
            Optional catalog version from `resolveAzureCloudConnectRequirements` for an optimistic freshness check (`409 onboarding.catalog_version_stale` if stale); the server always records its current active catalog version on commit.
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
    AzureCloudConnectManagementGroup:
      type: object
      additionalProperties: false
      required:
        - id
        - etag
        - revision
        - tenantId
        - managementGroupId
        - bindingId
        - featureIds
        - registration
        - baselineChecks
        - featureVerification
        - followUps
      description: >-
        Registered Microsoft Azure management-group Cloud Connect resource. Each Azure tenant holds at most one management-group connection (`409 onboarding.connection_exists` on a second registration in the same tenant).
      properties:
        id:
          type: string
          readOnly: true
          description: Opaque server-assigned Azure connection identifier. Do not construct client-side; pass the returned `id` to subsequent calls.
          example: microsoft-azure-11111111-1111-4111-8111-111111111111
        etag:
          type: string
          readOnly: true
          pattern: '^"[!-~]+"$'
          description: >-
            Strong ETag matching the `ETag` response header for this Azure management group. Derived solely from configuration `revision` and document incarnation; background health checks, `verify` runs, and follow-up transitions do not change `etag`.
          example: '"1.b7c2d9e0"'
        revision:
          type: string
          readOnly: true
          description: Opaque configuration revision.
          example: "1"
        tenantId:
          type: string
          pattern: "^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$"
          description: Microsoft Entra tenant UUID.
          x-doit-confidentiality: customer-data
          example: 11111111-1111-4111-8111-111111111111
        managementGroupId:
          type: string
          pattern: "^[A-Za-z0-9._()-]{1,90}$"
          description: Bare Azure management group ID.
          x-doit-confidentiality: customer-data
          example: example-platform
        bindingId:
          type: string
          readOnly: true
          description: >-
            Read-only deterministic Azure scope binding key used to correlate entries in `followUps`, `plannedFollowUps`, and verification `checks` back to this management group.
          example: binding_azure_management_group_0123456789abcdef0123456789abcdef
        featureIds:
          type: array
          format: set
          uniqueItems: true
          items:
            type: string
          description: >-
            Cloud Connect feature IDs enabled on this Azure management group, returned sorted in lexicographical ascending order (set semantics).
          example: [advisor]
        catalogVersion:
          type:
            - string
            - "null"
          description: >-
            Server catalog version recorded when this Azure connection was last created or patched (unchanged by `verify`, which records its own version under `featureVerification.catalogVersion`), or `null` for legacy records not yet mutated via v2.
          example: sha256:3f1b0c9d7e2a4b6c8d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e
        registeredVia:
          type: string
          readOnly: true
          enum:
            - api
            - console
            - cloudformation_callback
          description: Writer that created the current record.
          example: api
        clientUserAgent:
          type:
            - string
            - "null"
          readOnly: true
          description: Bounded User-Agent of the client that last mutated the record.
          example: terraform-provider-doit/1.6.0
        registration:
          $ref: "#/components/schemas/Registration"
          readOnly: true
          example:
            status: registered
            registrationTime: "2026-11-23T12:00:00Z"
        baselineChecks:
          $ref: "#/components/schemas/BaselineChecks"
          readOnly: true
          example:
            status: passed
            checkTime: "2026-11-23T12:00:00Z"
        featureVerification:
          $ref: "#/components/schemas/VerificationSummary"
          readOnly: true
          example:
            status: not_checked
        followUps:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/FollowUp"
          example: []
