# Resources generated from OpenAPI/openapi_spec_v2.yml (api-specs, external-api-v2).
# Same format as OpenAPI/1_tfplugingen-openapi/resources.yml. A resource lives in
# exactly one of the two configs. `make generate-v2` skips the schema generator
# while this file has no entries.
provider:
  name: doit
resources:
  cloudconnect_gcp_connection:
    create:
      path: /onboarding/v2/cloud-connect/gcp/connections
      method: POST
    read:
      path: /onboarding/v2/cloud-connect/gcp/connections/{id}
      method: GET
    update:
      path: /onboarding/v2/cloud-connect/gcp/connections/{id}
      method: PATCH
    delete:
      path: /onboarding/v2/cloud-connect/gcp/connections/{id}
      method: DELETE
  billing_gcp_account:
    create:
      path: /onboarding/v2/billing/gcp/accounts
      method: POST
    read:
      path: /onboarding/v2/billing/gcp/accounts/{id}
      method: GET
    delete:
      path: /onboarding/v2/billing/gcp/accounts/{id}
      method: DELETE
